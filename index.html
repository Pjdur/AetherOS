<!DOCTYPE html>
<html lang="en" class="h-full select-none overflow-hidden">
<head>
    <meta charset="UTF-8">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aether: {
                            50: '#f0f3ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            800: '#2e1065',
                            900: '#0f0728',
                            dark: '#0a0518'

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --glass-bg: rgba(15, 10, 35, 0.65);
            --glass-border: rgba(139, 92, 246, 0.25);
            --glass-blur: 16px;
            --accent-glow: rgba(124, 58, 237, 0.4);
            --accent-color: #8b5cf6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0518;
            color: #f1f5f9;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-header {
            background: rgba(25, 16, 50, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-button:hover {
            background: rgba(139, 92, 246, 0.25);
            border-color: rgba(167, 139, 250, 0.5);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .window-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(124, 58, 237, 0.15);
        }

        .window-shadow.active-window {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 25px var(--accent-glow);
            border-color: rgba(167, 139, 250, 0.5);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 5, 24, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.6);
        }

        /* Magnet Snap Preview */
        #snap-preview {
            transition: all 0.15s ease-out;
            pointer-events: none;
        }

        /* Background Animated Glows */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            pointer-events: none;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.1); }
            100% { transform: translate(-40px, 50px) scale(0.95); }
        }

        /* Desktop Icon selection */
        .desktop-icon {
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        .desktop-icon:hover {
            background-color: rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }
        .desktop-icon:active {
            transform: scale(0.95);
        }

        /* Taskbar animations */
        .taskbar-item {
            position: relative;
            transition: all 0.2s ease;
        }
        .taskbar-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: #a78bfa;
            border-radius: 2px;
            box-shadow: 0 0 8px #a78bfa;
        }
    </style>
</head>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(freq, duration, type = 'sine', volume = 0.08) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { console.warn('Audio play error', e); }
            }

            click() { this.playBeep(800, 0.04, 'sine', 0.04); }
            open() { 
                this.playBeep(440, 0.08, 'sine', 0.06); 
                setTimeout(() => this.playBeep(880, 0.1, 'sine', 0.06), 50); 
            }
            close() { this.playBeep(350, 0.08, 'triangle', 0.05); }
            notify() {
                this.playBeep(523.25, 0.08, 'sine', 0.08);
                setTimeout(() => this.playBeep(659.25, 0.12, 'sine', 0.08), 80);
            }
            error() {
                this.playBeep(220, 0.15, 'sawtooth', 0.08);
            }
        }

        class VirtualFileSystem {
            constructor() {
                this.STORAGE_KEY = 'aether_os_vfs_v2';
                this.tree = this.load() || this.getDefaultTree();
            }

            getDefaultTree() {
                return {
                    '': {
                        type: 'dir',
                        children: {
                            'Desktop': {
                                type: 'dir',
                                children: {
                                    'Welcome.txt': { type: 'file', content: 'Welcome to AetherOS!\n\nThis is an extensible web-based desktop environment featuring:\n- Complete Developer API (window.OS)\n- Vector Canvas Paint\n- Realtime System Monitor\n- Shell Terminal & Live App Studio\n\nDouble click files or apps to get started!' },

            save() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.tree));
                } catch(e) { console.error('Failed to save VFS', e); }
            }

            load() {
                try {
                    const data = localStorage.getItem(this.STORAGE_KEY);
                    return data ? JSON.parse(data) : null;
                } catch(e) { return null; }
            }

            getNode(path) {
                const parts = path.split('/').filter(p => p.length > 0);
                let current = this.tree[''];
                for (const part of parts) {
                    if (!current || current.type !== 'dir' || !current.children[part]) {
                        return null;
                    }
                    current = current.children[part];
                }
                return current;
            }

            listDir(path = '') {
                const node = this.getNode(path);
                if (!node || node.type !== 'dir') return [];
                return Object.keys(node.children).map(name => ({
                    name,
                    type: node.children[name].type,
                    size: node.children[name].type === 'file' ? (node.children[name].content || '').length : 0
                }));
            }

            readFile(path) {
                const node = this.getNode(path);
                if (!node || node.type !== 'file') return null;
                return node.content;
            }

            writeFile(path, content) {
                const parts = path.split('/').filter(p => p.length > 0);
                const fileName = parts.pop();
                const dirPath = parts.join('/');
                const parentNode = this.getNode(dirPath);
                if (!parentNode || parentNode.type !== 'dir') return false;

                parentNode.children[fileName] = {
                    type: 'file',
                    content: content
                };
                this.save();
                return true;
            }

            mkdir(path) {
                const parts = path.split('/').filter(p => p.length > 0);
                const dirName = parts.pop();
                const dirPath = parts.join('/');
                const parentNode = this.getNode(dirPath);
                if (!parentNode || parentNode.type !== 'dir') return false;

                if (!parentNode.children[dirName]) {
                    parentNode.children[dirName] = {
                        type: 'dir',
                        children: {}
                    };
                    this.save();
                }
                return true;
            }

            remove(path) {
                const parts = path.split('/').filter(p => p.length > 0);
                const name = parts.pop();
                const parentNode = this.getNode(parts.join('/'));
                if (parentNode && parentNode.children && parentNode.children[name]) {
                    delete parentNode.children[name];
                    this.save();
                    return true;
                }
                return false;
            }
        }

        class Window {
            constructor(options = {}) {
                this.id = options.id || 'win_' + Math.random().toString(36).substr(2, 9);
                this.title = options.title || 'Application';
                this.icon = options.icon || `<svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/></svg>`;
                this.width = options.width || 640;
                this.height = options.height || 480;
                this.x = options.x !== undefined ? options.x : Math.max(20, Math.floor(Math.random() * (window.innerWidth - this.width - 40)));
                this.y = options.y !== undefined ? options.y : Math.max(20, Math.floor(Math.random() * (window.innerHeight - this.height - 80)));
                this.content = options.content || '';
                this.resizable = options.resizable !== false;
                this.minimizable = options.minimizable !== false;

                this.isMaximized = false;
                this.isMinimized = false;

                this.element = this.createDOM();

            }

            createDOM() {
                const el = document.createElement('div');
                el.id = this.id;
                el.className = 'absolute pointer-events-auto flex flex-col rounded-2xl glass-panel window-shadow border border-purple-500/30 overflow-hidden transition-all duration-75';
                el.style.width = `${this.width}px`;
                el.style.height = `${this.height}px`;
                el.style.transform = `translate3d(${this.x}px, ${this.y}px, 0px)`;
                
                el.innerHTML = `
                    <!-- Window Header -->
                    <div class="window-header h-10 glass-header flex items-center justify-between px-3 cursor-grab active:cursor-grabbing select-none">
                        <div class="flex items-center space-x-2 text-xs font-semibold text-slate-200 pointer-events-none truncate">
                            <span class="window-icon">${this.icon}</span>
                            <span class="window-title truncate">${this.title}</span>
                        </div>
                        <div class="flex items-center space-x-1.5 pointer-events-auto">
                            ${this.minimizable ? `<button class="win-btn-min w-3.5 h-3.5 rounded-full bg-amber-500/80 hover:bg-amber-400 flex items-center justify-center text-[8px] text-amber-950 font-bold">&#8722;</button>` : ''}
                            <button class="win-btn-max w-3.5 h-3.5 rounded-full bg-emerald-500/80 hover:bg-emerald-400 flex items-center justify-center text-[8px] text-emerald-950 font-bold">&#9633;</button>
                            <button class="win-btn-close w-3.5 h-3.5 rounded-full bg-rose-500/80 hover:bg-rose-400 flex items-center justify-center text-[8px] text-rose-950 font-bold">&#10005;</button>
                        </div>
                    </div>

                    <!-- Window Content Body -->
                    <div class="window-body flex-1 overflow-auto relative bg-slate-950/40 text-slate-100 p-0">
                        ${typeof this.content === 'string' ? this.content : ''}
                    </div>

                    <!-- Resize Handles -->
                    ${this.resizable ? `
                        <div class="resize-handle res-n absolute top-0 left-0 right-0 h-1.5 cursor-n-resize"></div>
                        <div class="resize-handle res-s absolute bottom-0 left-0 right-0 h-1.5 cursor-s-resize"></div>
                        <div class="resize-handle res-w absolute top-0 bottom-0 left-0 w-1.5 cursor-w-resize"></div>
                        <div class="resize-handle res-e absolute top-0 bottom-0 right-0 w-1.5 cursor-e-resize"></div>
                        <div class="resize-handle res-nw absolute top-0 left-0 w-3 h-3 cursor-nw-resize"></div>
                        <div class="resize-handle res-ne absolute top-0 right-0 w-3 h-3 cursor-ne-resize"></div>
                        <div class="resize-handle res-sw absolute bottom-0 left-0 w-3 h-3 cursor-sw-resize"></div>
                        <div class="resize-handle res-se absolute bottom-0 right-0 w-3 h-3 cursor-se-resize"></div>
                    ` : ''}

                if (typeof this.content !== 'string' && this.content instanceof HTMLElement) {

                }

                return el;
            }

            attachEvents() {
                const header = this.element.querySelector('.window-header');
                const closeBtn = this.element.querySelector('.win-btn-close');
                const maxBtn = this.element.querySelector('.win-btn-max');
                const minBtn = this.element.querySelector('.win-btn-min');

                // Header Focus
                this.element.addEventListener('pointerdown', () => {
                    OS.WindowManager.focusWindow(this);
                });

                // Dragging logic
                let isDragging = false;
                let startX, startY, origX, origY;

                const onPointerDown = (e) => {
                    if (e.target.closest('button')) return;
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    origX = this.x;
                    origY = this.y;
                    header.setPointerCapture(e.pointerId);
                };

                const onPointerMove = (e) => {
                    if (!isDragging) return;
                    if (this.isMaximized) {
                        this.toggleMaximize();
                        origX = e.clientX - this.width / 2;
                    }
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    this.x = origX + dx;
                    this.y = origY + dy;
                    this.updateTransform();

                    // Edge snapping logic
                    const snapPreview = document.getElementById('snap-preview');
                    if (e.clientX < 15) {
                        snapPreview.classList.remove('hidden');
                        snapPreview.style.left = '8px';
                        snapPreview.style.top = '8px';
                        snapPreview.style.width = 'calc(50vw - 12px)';
                        snapPreview.style.height = 'calc(100vh - 64px)';
                    } else if (e.clientX > window.innerWidth - 15) {
                        snapPreview.classList.remove('hidden');
                        snapPreview.style.left = 'calc(50vw + 4px)';
                        snapPreview.style.top = '8px';
                        snapPreview.style.width = 'calc(50vw - 12px)';
                        snapPreview.style.height = 'calc(100vh - 64px)';
                    } else if (e.clientY < 15) {
                        snapPreview.classList.remove('hidden');
                        snapPreview.style.left = '8px';
                        snapPreview.style.top = '8px';
                        snapPreview.style.width = 'calc(100vw - 16px)';
                        snapPreview.style.height = 'calc(100vh - 64px)';
                    } else {
                        snapPreview.classList.add('hidden');
                    }
                };

                const onPointerUp = (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    const snapPreview = document.getElementById('snap-preview');
                    snapPreview.classList.add('hidden');

                    if (e.clientX < 15) {
                        this.snapTo('left');
                    } else if (e.clientX > window.innerWidth - 15) {
                        this.snapTo('right');
                    } else if (e.clientY < 15) {
                        if (!this.isMaximized) this.toggleMaximize();
                    }
                };

                header.addEventListener('pointerdown', onPointerDown);
                header.addEventListener('pointermove', onPointerMove);
                header.addEventListener('pointerup', onPointerUp);

                // Control buttons
                closeBtn?.addEventListener('click', (e) => { e.stopPropagation(); this.close(); });
                maxBtn?.addEventListener('click', (e) => { e.stopPropagation(); this.toggleMaximize(); });
                minBtn?.addEventListener('click', (e) => { e.stopPropagation(); this.minimize(); });

                // 8-Way Resizing Logic
                if (this.resizable) {
                    const handles = this.element.querySelectorAll('.resize-handle');
                    handles.forEach(handle => {
                        handle.addEventListener('pointerdown', (e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            OS.WindowManager.focusWindow(this);

                            const direction = handle.className.match(/res-([a-z]+)/)[1];
                            const startWidth = this.width;
                            const startHeight = this.height;
                            const startX = e.clientX;
                            const startY = e.clientY;
                            const startPosX = this.x;
                            const startPosY = this.y;

                            const doResize = (re) => {
                                const dx = re.clientX - startX;
                                const dy = re.clientY - startY;

                                if (direction.includes('e')) this.width = Math.max(280, startWidth + dx);
                                if (direction.includes('s')) this.height = Math.max(180, startHeight + dy);
                                if (direction.includes('w')) {
                                    const nw = Math.max(280, startWidth - dx);
                                    if (nw > 280) { this.width = nw; this.x = startPosX + dx; }
                                }
                                if (direction.includes('n')) {
                                    const nh = Math.max(180, startHeight - dy);
                                    if (nh > 180) { this.height = nh; this.y = startPosY + dy; }
                                }
                                this.updateTransform();
                            };

                            const stopResize = () => {
                                window.removeEventListener('pointermove', doResize);
                                window.removeEventListener('pointerup', stopResize);
                            };

                            window.addEventListener('pointermove', doResize);
                            window.addEventListener('pointerup', stopResize);
                        });
                    });
                }
            }

            snapTo(side) {
                this.prevRect = { x: this.x, y: this.y, w: this.width, h: this.height };
                this.y = 8;
                this.height = window.innerHeight - 64;
                this.width = Math.floor(window.innerWidth / 2) - 12;
                if (side === 'left') {
                    this.x = 8;
                } else if (side === 'right') {
                    this.x = Math.floor(window.innerWidth / 2) + 4;
                }
                this.updateTransform();
            }

            toggleMaximize() {
                OS.Sound.click();
                if (this.isMaximized) {
                    if (this.prevRect) {
                        this.x = this.prevRect.x;
                        this.y = this.prevRect.y;
                        this.width = this.prevRect.w;
                        this.height = this.prevRect.h;
                    }
                    this.isMaximized = false;
                } else {
                    this.prevRect = { x: this.x, y: this.y, w: this.width, h: this.height };
                    this.x = 8;
                    this.y = 8;
                    this.width = window.innerWidth - 16;
                    this.height = window.innerHeight - 64;
                    this.isMaximized = true;
                }
                this.updateTransform();
            }

            minimize() {
                OS.Sound.close();
                this.isMinimized = true;
                this.element.style.display = 'none';
                OS.WindowManager.updateTaskbar();
            }

            restore() {
                OS.Sound.open();
                this.isMinimized = false;
                this.element.style.display = 'flex';
                OS.WindowManager.focusWindow(this);
            }

            close() {
                OS.Sound.close();
                if (this.onClose) this.onClose();
                this.element.remove();
                OS.WindowManager.unregisterWindow(this);
            }

            updateTransform() {
                this.element.style.width = `${this.width}px`;
                this.element.style.height = `${this.height}px`;
                this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0px)`;
            }
        }

        class WindowManager {
            constructor() {
                this.windows = [];
                this.activeWindow = null;
                this.baseZ = 100;
                this.container = document.getElementById('windows-container');
            }

            createWindow(options) {
                OS.Sound.open();
                const win = new Window(options);
                this.windows.push(win);
                this.container.appendChild(win.element);
                this.focusWindow(win);
                this.updateTaskbar();
                return win;
            }

            unregisterWindow(win) {
                this.windows = this.windows.filter(w => w.id !== win.id);
                if (this.activeWindow === win) {
                    this.activeWindow = this.windows[this.windows.length - 1] || null;
                    if (this.activeWindow) this.focusWindow(this.activeWindow);
                }
                this.updateTaskbar();
            }

            focusWindow(win) {
                if (win.isMinimized) win.restore();
                this.windows.forEach(w => {
                    w.element.classList.remove('active-window');
                });
                this.windows = this.windows.filter(w => w.id !== win.id);
                this.windows.push(win);

                this.windows.forEach((w, idx) => {
                    w.element.style.zIndex = this.baseZ + idx;
                });

                win.element.classList.add('active-window');
                this.activeWindow = win;
                this.updateTaskbar();
            }

            updateTaskbar() {
                const container = document.getElementById('taskbar-apps');
                container.innerHTML = '';

                this.windows.forEach(win => {
                    const tab = document.createElement('button');
                    tab.className = `taskbar-item flex items-center space-x-2 px-3 py-1 rounded-xl text-xs font-medium transition ${win === this.activeWindow && !win.isMinimized ? 'bg-purple-600/40 text-white border border-purple-400/40 active' : 'bg-white/5 hover:bg-white/10 text-slate-300'}`;
                    tab.innerHTML = `
                        <span class="w-4 h-4">${win.icon}</span>
                        <span class="truncate max-w-[100px]">${win.title}</span>
                    `;
                    tab.onclick = () => {
                        if (win.isMinimized) {
                            win.restore();
                        } else if (win === this.activeWindow) {
                            win.minimize();
                        } else {
                            this.focusWindow(win);
                        }
                    };
                    container.appendChild(tab);
                });
            }
        }

                        currentElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');

                        currentElement.setAttribute('stroke-width', strokeWidth);
                        currentElement.setAttribute('fill', 'none');

                        currentElement.setAttribute('d', `${d} L ${pt.x} ${pt.y}`);

                        const h = pt.y - startY;
                        currentElement.setAttribute('x', w < 0 ? pt.x : startX);

                        currentElement.setAttribute('width', Math.abs(w));

                                <button class="calc-b p-3 rounded-xl glass-button text-rose-300" data-v="C">C</button>
                                <button class="calc-b p-3 rounded-xl glass-button text-purple-300" data-v="/">/</button>
                                <button class="calc-b p-3 rounded-xl glass-button text-purple-300" data-v="*">*</button>
                                <button class="calc-b p-3 rounded-xl glass-button text-purple-300" data-v="-">-</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="7">7</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="8">8</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="9">9</button>
                                <button class="calc-b p-3 rounded-xl glass-button text-purple-300" data-v="+">+</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="4">4</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="5">5</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="6">6</button>
                                <button class="calc-b p-3 rounded-xl glass-button bg-purple-600/50 text-white row-span-2" data-v="=">=</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="1">1</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="2">2</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v="3">3</button>
                                <button class="calc-b p-3 rounded-xl glass-button col-span-2" data-v="0">0</button>
                                <button class="calc-b p-3 rounded-xl glass-button" data-v=".">.</button>
                            </div>
                        </div>
                    `
                });

                const disp = win.element.querySelector('#calc-disp');
                win.element.querySelectorAll('.calc-b').forEach(btn => {
                    btn.onclick = () => {
                        const v = btn.dataset.v;
                        if (v === 'C') disp.value = '0';
                        else if (v === '=') {
                            try { disp.value = eval(disp.value); } catch(e) { disp.value = 'Error'; }
                        } else {
                            disp.value = disp.value === '0' ? v : disp.value + v;
                        }
                    };
                });
            }
        });

        // 8. App Studio & API Playground
        OS.registerApp({
            id: 'app-studio',
            name: 'App Studio',
            icon: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>`,
            launch() {
                const win = OS.createWindow({
                    title: 'App Studio & API Playground',
                    width: 660,
                    height: 480,
                    content: `
                        <div class="flex flex-col h-full bg-slate-950 text-xs">
                            <div class="p-2 glass-header flex justify-between items-center">
                                <span class="font-bold text-purple-300">Aether Public Window API (window.OS)</span>
                                <button id="studio-run" class="px-4 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 rounded-xl font-bold text-white transition shadow-lg">Execute App</button>
                            </div>
                            <textarea id="studio-code" class="flex-1 bg-slate-900/90 p-4 text-emerald-400 font-mono focus:outline-none resize-none leading-relaxed" spellcheck="false">// Program custom windows directly via OS API!
const customWin = OS.createWindow({
  title: "Dynamic User App",
  width: 360,
  height: 220,
  content: \`
    <div class="p-6 text-center space-y-4">
      <h3 class="text-lg font-bold text-purple-300">Hello AetherOS!</h3>
      <button id="notify-btn" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold text-white transition">Trigger System Notification</button>
    </div>
  \`
});

customWin.element.querySelector('#notify-btn').onclick = () => {
  OS.notify({ title: "App Studio", message: "Successfully executed custom script!" });
};</textarea>
                        </div>
                    `
                });

                win.element.querySelector('#studio-run').onclick = () => {
                    const code = win.element.querySelector('#studio-code').value;
                    try {
                        new Function('OS', code)(OS);
                    } catch(err) {
                        OS.notify({ title: 'App Studio Error', message: err.message, type: 'error' });
                    }
                };
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            // Load wallpaper
            const savedWp = localStorage.getItem('aether_wallpaper') || 'nebula';
            OS.setWallpaper(savedWp);

            // Render Desktop Icons & Start items
            OS.renderDesktopAndStartMenu();

            // Clock update
            const updateClock = () => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
                document.getElementById('clock-time').innerText = timeStr;
                document.getElementById('clock-date').innerText = dateStr;
                document.getElementById('lock-clock').innerText = timeStr;
                document.getElementById('lock-date').innerText = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
            };
            setInterval(updateClock, 1000);
            updateClock();

            // Lock Screen Login Handler
            document.getElementById('login-form').onsubmit = (e) => {
                e.preventDefault();
                document.getElementById('lock-screen').classList.add('opacity-0', 'pointer-events-none');
                OS.Sound.open();
                OS.notify({ title: 'Welcome Back', message: 'AetherOS session initialized.' });
            };

            // Start Menu Toggle
            const startBtn = document.getElementById('start-btn');
            const startMenu = document.getElementById('start-menu');
            startBtn.onclick = (e) => {
                e.stopPropagation();
                OS.Sound.click();
                if (startMenu.classList.contains('hidden')) {
                    startMenu.classList.remove('hidden');
                    setTimeout(() => startMenu.classList.remove('scale-95', 'opacity-0'), 10);
                } else {
                    startMenu.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => startMenu.classList.add('hidden'), 200);
                }
            };

            // Notifications Toggle Drawer
            const notifBtn = document.getElementById('notif-toggle-btn');
            const notifDrawer = document.getElementById('notification-drawer');
            notifBtn.onclick = (e) => {
                e.stopPropagation();
                notifDrawer.classList.toggle('hidden');
            };

            document.getElementById('clear-notifs-btn').onclick = () => {
                OS.notifications = [];
                OS.renderNotifications();
            };

            // Right Click Context Menu
            const ctxMenu = document.getElementById('context-menu');
            window.oncontextmenu = (e) => {
                e.preventDefault();
                ctxMenu.style.left = `${Math.min(e.clientX, window.innerWidth - 200)}px`;
                ctxMenu.style.top = `${Math.min(e.clientY, window.innerHeight - 200)}px`;
                ctxMenu.classList.remove('hidden');
            };

            window.onclick = () => {
                ctxMenu.classList.add('hidden');
                if (!startMenu.classList.contains('hidden')) {
                    startMenu.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => startMenu.classList.add('hidden'), 200);
                }
            };

            // Context menu actions
            ctxMenu.querySelectorAll('.ctx-item').forEach(item => {
                item.onclick = (e) => {
                    e.stopPropagation();
                    ctxMenu.classList.add('hidden');
                    const action = item.dataset.action;
                    if (action === 'new-file') OS.apps['text-editor']?.launch();
                    if (action === 'new-folder') OS.apps['file-explorer']?.launch();
                    if (action === 'open-terminal') OS.apps['terminal']?.launch();
                    if (action === 'open-settings') OS.apps['settings']?.launch();
                    if (action === 'refresh') location.reload();
                };
            });

            // Start Menu search input
            document.getElementById('start-search-input').oninput = (e) => {
                const query = e.target.value.toLowerCase();
                document.querySelectorAll('#start-apps-grid button').forEach(btn => {
                    const text = btn.innerText.toLowerCase();
                    btn.style.display = text.includes(query) ? 'flex' : 'none';
                });
            };

            // Lock / Restart buttons
            document.getElementById('lock-btn').onclick = () => {
                document.getElementById('lock-screen').classList.remove('opacity-0', 'pointer-events-none');
            };
            document.getElementById('reboot-btn').onclick = () => location.reload();

            // Auto open welcome file editor on startup
            setTimeout(() => {
                OS.apps['file-explorer']?.launch('Desktop');
            }, 600);
        });
    </script>
</body>
</html>
